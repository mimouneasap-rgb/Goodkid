<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>APQR Command Center</title>
  <meta name="description" content="Annual Product Quality Review programme tracker: annual plan, Scigeniq workflows, tasks, workload, statistics and SOP guidance in one editable workspace.">
  <meta name="theme-color" content="#0b1022">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="APQR">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/apqr.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      const t = localStorage.getItem("goodkid.apqr.theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch { /* storage blocked */ }
  </script>
</head>
<body>
  <div class="shell">
    <aside class="rail" id="rail" aria-label="Main navigation"></aside>
    <div class="scrim" id="scrim"></div>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="content" tabindex="-1"></main>
    </div>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <div class="tooltip" id="tooltip" role="tooltip"></div>
  <noscript><p style="padding:24px">The APQR Command Center needs JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
