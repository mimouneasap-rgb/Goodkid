<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Batch Release Desk</title>
  <meta name="description" content="CLL received vs AX: release lead times, ERP 365 / AX reconciliation and blocked finished products.">
  <meta name="theme-color" content="#0e2326">
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- shell:start -->
<div class="shell">
  <aside class="rail">
    <div class="brand">
      <svg id="brand-mark" viewBox="0 0 34 34" aria-hidden="true"></svg>
      <div><span class="brand-name">Batch Release Desk</span><span class="brand-sub">CLL · ERP 365 · AX</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="rail-foot">
      <dl id="doc"></dl>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div><div class="crumb" id="crumb"></div><h1 id="title">Batch Release Desk</h1></div>
      <span class="spacer"></span>
      <button class="btn ghost" id="reset-btn" data-act="reset" hidden>Use bundled data</button>
      <button class="btn ghost" id="theme-btn" data-act="theme" aria-label="Change theme"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm0 1.6v10.8A5.4 5.4 0 0 1 8 2.6z"/></svg><span>Auto</span></button>
      <button class="btn primary" data-act="import"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7.2 1h1.6v7.1l2.6-2.6 1.1 1.1L8 11.1 3.5 6.6l1.1-1.1 2.6 2.6zM2 12.5h1.6v1.4h8.8v-1.4H14V15.5H2z"/></svg><span class="hide-sm">Load workbook</span></button>
    </header>
    <div id="view"></div>
  </main>
</div>
<nav class="mobile-nav" id="mobile-nav" aria-label="Main"></nav>
<div id="drawer" hidden></div>
<div class="dropzone" id="dropzone" hidden><div>Drop the CLL vs AX workbook to load it</div></div>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="file" accept=".xlsx,.xlsm,.xls" hidden>
<!-- shell:end -->
<!-- Your workbook data. Generated locally and not committed (see README). The app runs without it: load the workbook from the page. -->
<script src="data.js" onerror="void 0"></script>
<script src="model.js"></script>
<script src="app.js"></script>
</body>
</html>
